[package]
name = "engineer-hal"
version = "0.1.0"
edition = "2021"
description = "Rust reimplementation of the OPLUS engineer AIDL HAL (vendor.oplus.hardware.engineer.IEngineer)"
license = "Apache-2.0"

[lib]
name = "engineer_hal"
path = "src/lib.rs"

[[bin]]
name = "engineer-hal-service"
path = "src/main.rs"

[dependencies]
binder = { package = "binder_ndk", version = "0.2" }
libc = "0.2"

[features]
default = []
vintf_stability = []

[patch.crates-io]
binder_ndk = { path = "vendor/binder_ndk" }
binder_ndk_sys = { path = "vendor/binder_ndk_sys" }
